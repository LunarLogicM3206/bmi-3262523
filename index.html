<!DOCTYPE html>  <html lang="en">  <head>  
    <meta charset="UTF-8" />  
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />  
    <title>BMI Calculator</title>  
    <style>  
        /* Header section positioning and image sizing */
        .header-intro {
            text-align: center;
            max-width: 450px;
            margin: 40px auto 20px auto;
            font-size: 20px;
        }

        .header-intro h2 {
            margin-bottom: 8px;
            font-size: 35px;
        }

        .header-intro p {
            margin-bottom: 15px;
            color: #333;
            line-height: 1.4;
            font-size: 20px;
        }


        .container {  
            border: 2px solid black;  
            width: 350px;  
            padding: 25px;  
            border-radius: 20px;  
            background-color: rgb(230, 226, 222);  
            max-width: fit-content;  
            margin-left: auto;  
            margin-right: auto;  
            margin-top: 30px; 
        }  h1 {  
        text-align: center;  
    }  

    input {  
        width: 100%;  
        padding: 8px;  
        box-sizing: border-box;  
    }  
</style>

</head>  <body style="background-color: rgb(244, 255, 244)">  

    
    <div class="header-intro">
        <h2>Welcome to the BMI Calculator</h2>
        <p>Body Mass Index (BMI) is a simple metric calculated from your height and weight to help estimate body fat.</p>
       

    <div class="container">  
        <h1>BMI Calculator</h1>  <p>Height (in cm)</p>  
    <input type="number" id="height" placeholder="e.g. 175" />  

    <p>Weight (in kg)</p>  
    <input type="number" id="weight" placeholder="e.g. 70" />  

    <br /><br />  
    <button id="btn" onclick="calculateBMI()">Calculate</button>  

    <div id="result" style="margin-top: 15px; font-weight: bold;"></div>  
</div>  

<script>  
    function calculateBMI() {  
        const height = parseFloat(document.getElementById("height").value);  
        const weight = parseFloat(document.getElementById("weight").value);  
        const result = document.getElementById("result");  

        if (!height || !weight || height <= 0 || weight <= 0) {  
            result.innerText = "Please enter valid height and weight values.";  
            return;  
        }  

        const bmi = (weight / Math.pow(height / 100, 2)).toFixed(2);  

        let category = "";  
        let bgColor = "";  

        if (bmi < 18.5) {  
            category = "Underweight";  
            bgColor = "#00FFFF"; 
        } else if (bmi < 24.9) {  
            category = "Normal Weight";  
            bgColor = "00FF00"; 
        } else if (bmi < 29.9) {  
            category = "Overweight";  
            bgColor = "#FFFF00"; 
        } else {  
            category = "Obesity";  
            bgColor = "#FF0000";  
        }  

        
        document.body.style.backgroundColor = bgColor;  

        result.innerText = `BMI: ${bmi} (${category})`;  
    }  
</script>

</body>  </html>
